     <p><b>Por porción:</b> ${f1(T.k*q,0)} kcal · CHO ${f1(T.c*q)} g · P ${f1(T.p*q)} g · G ${f1(T.f*q)} g</p>
     ${miss.length?msg('Se omitieron ingredientes que no están en tu lista: '+miss.map(esc).join(', '),'info'):''}
     <p class="hint">${esc(GENR.prep)}</p><div class="row"><button class="btn" onclick="saveGen()">Guardar receta</button><button class="btn sec" onclick="GENR=null;$('oAI').innerHTML=''">Descartar</button></div></div>`;
  }catch(e){o.innerHTML=msg(esc(e.message||'No se pudo conectar.'),'err')}
}
function saveGen(){if(!GENR)return;const id=uid();S.recipes.push({id,name:GENR.name,portions:GENR.portions,yield:null,prep:'(Borrador de IA, revisar) '+GENR.prep,ings:GENR.ings});S.recSel=id;GENR=null;save();render()}


/* ========== Google Calendar ========== */
function calLink(a){
  const nm=(S.patients.find(p=>p.id===a.pid)||{}).name||'Paciente',e0=new Date(a.date+'T'+(a.time||'09:00')+':00'),e1=new Date(e0.getTime()+36e5),p2=n=>String(n).padStart(2,'0'),
    fmt=x=>x.getFullYear()+p2(x.getMonth()+1)+p2(x.getDate())+'T'+p2(x.getHours())+p2(x.getMinutes())+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Consulta: '+nm)+'&dates='+fmt(e0)+'/'+fmt(e1)+'&details='+encodeURIComponent(a.motive||'');
}

/* ========== Sodio y micronutrientes del plan ========== */
const MIC=[['na','Sodio'],['po','Potasio'],['ca','Calcio'],['fe','Hierro'],['vc','Vitamina C']];
function microItem(it){
  const o={v:{},m:{}};MIC.forEach(([k])=>{o.v[k]=0;o.m[k]=false});
  const addF=(f,g)=>MIC.forEach(([k])=>{if(f[k]!=null&&!isNaN(f[k]))o.v[k]+=f[k]*g/100;else o.m[k]=true});
  if(it.type==='food'){const f=S.foods.find(x=>x.id===it.fid);if(f)addF(f,gramsOf(f,it.qty,it.m))}
  else if(it.type==='rec'){const r=S.recipes.find(x=>x.id===it.rid);if(r)r.ings.forEach(i=>{const f=S.foods.find(x=>x.id===i.fid);if(f)addF(f,i.g*it.por/r.portions)})}
  else MIC.forEach(([k])=>o.m[k]=true);
  return o;
}
function microHtml(items){
  if(!items.length)return '';
  const T={v:{},m:{}};MIC.forEach(([k])=>{T.v[k]=0;T.m[k]=false});
  items.forEach(it=>{const o=microItem(it);MIC.forEach(([k])=>{T.v[k]+=o.v[k];T.m[k]=T.m[k]||o.m[k]})});
  const p=P(),F=p&&p.sex==='F',REF={na:['< 2000 mg',v=>v<=2000],po:['≥ 3500 mg',v=>v>=3500],ca:['1000 mg',v=>v>=1000],fe:[F?'18 mg':'8 mg',v=>v>=(F?18:8)],vc:[F?'75 mg':'90 mg',v=>v>=(F?75:90)]};
  const rows=MIC.map(([k,n])=>{const [rt,ok]=REF[k],v=T.v[k],st=T.m[k]?'<span class="pill lo">Datos incompletos</span>':ok(v)?'<span class="pill ok">Cumple</span>':k==='na'?'<span class="pill hi">Por encima del límite</span>':'<span class="pill lo">Por debajo</span>';
    return `<tr><td>${n}</td><td>${f1(v,0)} mg${T.m[k]?' <small>(parcial)</small>':''}</td><td>${rt}</td><td>${st}</td></tr>`}).join('');
  return `<div class="card"><h3>Sodio y micronutrientes</h3><div class="scroll"><table><thead><tr><th>Nutriente</th><th>Aporte del plan</th><th>Referencia diaria (adulto)</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>${msg('Solo suman los alimentos que tienen el dato (los buscados en USDA lo traen). Referencias generales para adultos; no incluyen embarazo ni condiciones médicas.','info')}</div>`;
}


/* ========== Importar recetas (pegar o CSV) ========== */
function downloadRecipeTemplate(){
  const b=new Blob(['\ufeffreceta;porciones;ingrediente;gramos;preparacion\n'],{type:'text/csv'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='plantilla-recetas.csv';document.body.appendChild(a);a.click();a.remove();
}
function importRecipes(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>importRecipesText(String(rd.result));rd.readAsText(f);inp.value=''}
function importRecipesText(txt){
  const o=$('oRI'),lines=String(txt).replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());
  if(lines.length<2)return o.innerHTML=msg('No hay filas de datos. Incluye el encabezado y al menos un ingrediente.','err');
  const d=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':',',H=csvLine(lines[0],d).map(norm),col=(...a)=>H.findIndex(h=>a.some(x=>h.startsWith(x)));
  const ix={r:col('receta','nombre'),p:col('porcion'),i:col('ingred','alimento'),g:col('gramo','cantidad'),pr:col('prepar')};
  if([ix.r,ix.i,ix.g].some(v=>v<0))return o.innerHTML=msg('Faltan columnas en el encabezado: receta, ingrediente y gramos son obligatorias (porciones y preparacion son opcionales). Descarga la plantilla.','err');
  const num=s=>{s=(s||'').trim();return s===''?null:Number(s.replace(',','.'))},G={},order=[],errs=[];
  lines.slice(1).forEach((l,i)=>{
    const r=csvLine(l,d),name=r[ix.r],ing=r[ix.i],g=num(r[ix.g]),ln=i+2;
    if(!name||!ing)return errs.push(`Línea ${ln}: falta la receta o el ingrediente.`);
    if(g===null||isNaN(g)||g<=0||g>5000)return errs.push(`Línea ${ln} (${name}): gramos inválidos.`);
    const k=norm(name);if(!G[k]){G[k]={name,por:null,prep:'',rows:[]};order.push(k)}
    const p=ix.p>=0?num(r[ix.p]):null;if(p>0&&!G[k].por)G[k].por=p;
    if(ix.pr>=0&&r[ix.pr]&&!G[k].prep)G[k].prep=r[ix.pr];
    G[k].rows.push({ing,g});
  });
  let ok=0;
  order.forEach(k=>{
    const x=G[k];
    if(S.recipes.some(a=>norm(a.name)===k))return errs.push(`${x.name}: ya existe, se omitió.`);
    const ings=[],miss=[];
    x.rows.forEach(w=>{
      let f=S.foods.find(a=>norm(a.n)===norm(w.ing));
      if(!f){const c=S.foods.filter(a=>norm(a.n).includes(norm(w.ing)));if(c.length===1)f=c[0]}
      if(f)ings.push({fid:f.id,g:w.g});else miss.push(w.ing);
    });
    if(miss.length)return errs.push(`${x.name}: no se encontró en tus alimentos (o hay varios iguales): ${miss.join(', ')}. Agrégalos o corrige el nombre y vuelve a importar.`);
    S.recipes.push({id:uid(),name:x.name.slice(0,80),portions:x.por||1,yield:null,prep:x.prep,ings});ok++;
  });
  save();render();
  $('oRI').innerHTML=msg(`Se importaron ${ok} receta(s).`,ok?'ok':'warn')+(errs.length?msg(`${errs.length} aviso(s):<br>${errs.slice(0,10).map(esc).join('<br>')}${errs.length>10?'<br>…':''}`,'warn'):'');
}

function applyFM(){document.documentElement.classList.toggle('fm',!!(S.anim&&S.animSet))}
updSnd();render();
