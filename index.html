<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1f24;--ink2:#2b3d44;--mut:#64767d;--bg:#f3f6f7;--card:#fff;--line:#e3eaed;--pri:#0f8b72;--pri2:#0a6a58;--pri3:#e6f5f1;--acc:#e8a33d;--side:#0b2b30;--side2:#12414a;--err:#b42318;--warn:#a15c07;--ok:#117a43;--r:14px;
--sh:0 1px 2px rgba(15,31,36,.04),0 10px 26px -14px rgba(15,31,36,.14);--shh:0 2px 4px rgba(15,31,36,.05),0 20px 40px -16px rgba(15,31,36,.26)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheen{from{background-position:0 0}to{background-position:200% 0}}

.side{position:fixed;inset:0 auto 0 0;width:248px;background:linear-gradient(180deg,#0d3238 0%,#081f24 100%);color:#bcd3d4;display:flex;flex-direction:column;z-index:30;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.logo{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;font-size:1.3rem;font-weight:700;color:#fff;letter-spacing:.2px}
.logo b{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#19b394);box-shadow:0 6px 16px -6px rgba(25,179,148,.7)}
.logo b svg{width:19px;height:19px;stroke:#fff}
.logo span{color:var(--acc)}
.side nav{overflow-y:auto;flex:1;padding:6px 12px}
.side nav button{position:relative;overflow:hidden;display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;color:inherit;text-align:left;padding:11px 14px;border-radius:10px;font:500 .91rem Inter,system-ui,sans-serif;cursor:pointer;margin-bottom:3px;transition:background .2s,color .2s,transform .2s}
.side nav button svg{opacity:.75;transition:opacity .2s,transform .2s}
.side nav button:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(3px)}
.side nav button:hover svg{opacity:1}
.side nav button.on{background:linear-gradient(90deg,rgba(15,139,114,.95),rgba(15,139,114,.7));color:#fff;font-weight:600;box-shadow:0 8px 20px -10px rgba(15,139,114,.9)}
.side nav button.on svg{opacity:1}
.side nav button.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--acc)}
.side small{padding:14px 20px;color:#6f9496;font-size:.72rem;border-top:1px solid rgba(255,255,255,.07)}

.main{margin-left:248px;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top select{max-width:280px}
.burger{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);transition:background .2s;width:auto}
.burger:hover{background:var(--pri3)}
.sw{display:flex;align-items:center;gap:9px;font-size:.85rem;color:var(--ink2);margin-left:auto;cursor:pointer;margin-bottom:0}
.sw input{appearance:none;-webkit-appearance:none;width:38px;height:22px;padding:0;border:0;border-radius:99px;background:#cbd7db;position:relative;cursor:pointer;transition:background .25s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.sw input:checked{background:var(--pri)}
.sw input:checked::after{transform:translateX(16px)}
.banner{background:#fff7e3;color:#6b4a00;border-bottom:1px solid #f1deaa;padding:9px 24px;font-size:.84rem;animation:fade .5s both}
.banner.acad{background:#e9f1ff;color:#173b73;border-color:#c3d6f6}
#view{padding:26px 24px 60px;max-width:1120px;margin:0 auto}
#view>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
#view>*:nth-child(2){animation-delay:.05s}#view>*:nth-child(3){animation-delay:.1s}#view>*:nth-child(4){animation-delay:.15s}#view>*:nth-child(5){animation-delay:.2s}#view>*:nth-child(n+6){animation-delay:.25s}
h2.pt{margin:0 0 20px;font-size:1.6rem;font-weight:700;letter-spacing:-.4px}

.hero{position:relative;overflow:hidden;border-radius:20px;padding:30px 32px;margin-bottom:20px;color:#fff;background:radial-gradient(1200px 300px at 90% -20%,rgba(232,163,61,.35),transparent 60%),linear-gradient(120deg,#0b2b30,#0f6f60 60%,#14937a);box-shadow:0 24px 50px -24px rgba(11,43,48,.7)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);background-size:200% 100%;animation:sheen 6s linear infinite;pointer-events:none}
.hero h1{margin:0 0 6px;font-size:1.75rem;letter-spacing:-.5px}
.hero p{margin:0;max-width:560px;color:#cfe8e3;font-size:.97rem}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px;box-shadow:var(--sh);transition:box-shadow .3s,transform .3s}
.card:hover{box-shadow:var(--shh)}
.card h3{margin:0 0 14px;font-size:1.02rem;font-weight:650;letter-spacing:-.1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.stat{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--pri),var(--acc))}
.stat:hover{transform:translateY(-4px);box-shadow:var(--shh)}
.stat b{display:block;font-size:2rem;font-weight:700;color:var(--pri2);letter-spacing:-1px}
.stat span{color:var(--mut);font-size:.84rem;font-weight:500}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.quick button{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 10px;cursor:pointer;font:500 .92rem Inter,system-ui,sans-serif;color:var(--ink2);transition:all .25s cubic-bezier(.2,.7,.2,1)}
.quick button:hover{border-color:var(--pri);background:var(--pri3);color:var(--pri2);transform:translateY(-4px);box-shadow:0 14px 26px -16px rgba(15,139,114,.6)}
.quick i{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--pri3);color:var(--pri2);transition:all .25s;font-style:normal}
.quick i svg{width:22px;height:22px}
.quick button:hover i{background:var(--pri);color:#fff;transform:scale(1.08) rotate(-4deg)}

label{display:block;font-size:.76rem;font-weight:600;color:var(--mut);margin-bottom:5px;letter-spacing:.2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d3dee2;border-radius:10px;font:400 .95rem Inter,system-ui,sans-serif;background:#fff;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:hover,select:hover,textarea:hover{border-color:#b5c6cc}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px rgba(15,139,114,.14)}
input[type=checkbox]{accent-color:var(--pri)}
textarea{min-height:78px;resize:vertical}
.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--pri),#13a187);color:#fff;border:0;padding:11px 20px;border-radius:10px;font:600 .9rem Inter,system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 18px -10px rgba(15,139,114,.9);transition:transform .2s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 24px -12px rgba(15,139,114,.95);filter:brightness(1.05)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.sec{background:#fff;color:var(--pri2);border:1px solid #b9dcd3;box-shadow:none}
.btn.sec:hover{background:var(--pri3);border-color:var(--pri)}
.btn.sm{padding:6px 12px;font-size:.8rem;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:14px}

.steps{border-left:4px solid var(--pri);background:linear-gradient(90deg,#eef9f6,#f7fcfb);padding:14px 16px;border-radius:0 12px 12px 0;margin-top:14px;font-size:.9rem;animation:rise .4s both}
.steps div{margin:4px 0}.steps b{color:var(--pri2)}
.steps details summary{cursor:pointer;color:var(--pri2);font-weight:600;padding:2px 0}
.res{font-size:1.25rem;font-weight:700;color:var(--pri2);letter-spacing:-.3px}
.msg{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;margin-top:10px;font-size:.88rem;border-left:4px solid;animation:rise .35s both}
.msg .mi{flex:none;margin-top:1px}.msg .mi svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msg.err{background:#fdecea;color:var(--err);border-color:var(--err)}
.msg.warn{background:#fff3df;color:var(--warn);border-color:var(--acc)}
.msg.ok{background:#e4f6ec;color:var(--ok);border-color:var(--ok)}
.msg.info{background:#e8f2fa;color:#1e4a76;border-color:#4a8bc4}

table{width:100%;border-collapse:collapse;font-size:.87rem}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;background:#f8fafb}
tbody tr{transition:background .15s}
tbody tr:hover{background:#f5faf9}
.scroll{overflow-x:auto;border-radius:10px}
small,.mut{color:var(--mut)}
canvas{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff}
.x{background:none;border:0;color:#9aa9ae;cursor:pointer;font-size:1.25rem;line-height:1;padding:2px 8px;border-radius:8px;transition:all .2s}
.x:hover{background:#fdecea;color:var(--err);transform:scale(1.15)}
.tag{display:inline-block;background:#e6f0ff;color:#173b73;border-radius:99px;padding:2px 10px;font-size:.7rem;font-weight:600}
.tag.g{background:#e4f6ec;color:var(--ok)}
.pill{display:inline-block;border-radius:99px;padding:3px 11px;font-size:.74rem;font-weight:600;white-space:nowrap}
.pill.ok{background:#e4f6ec;color:var(--ok)}.pill.lo{background:#e8f2fa;color:#1e4a76}.pill.hi{background:#fff3df;color:var(--warn)}
.hint{color:var(--mut);font-size:.84rem;margin:0 0 12px}

@media(max-width:820px){
 .side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
 .main{margin-left:0}.burger{display:block}
 #view{padding:18px 14px 50px}.hero{padding:22px}.top{padding:10px 14px}
}
@media(prefers-reduced-motion:reduce){:root:not(.fm) *{animation:none!important;transition:none!important}}
@media print{.side,.top,.banner,.noprint{display:none!important}.main{margin:0}#view{padding:0}#view>*{animation:none}.card{border:0;box-shadow:none;break-inside:avoid}}

/* Animaciones de entrada a una sección */
#view{transition:opacity .17s ease,transform .17s ease}
#view.leave{opacity:0;transform:translateY(-10px)}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .65s ease-out forwards}
.btn.sec .rip,.quick .rip{background:rgba(15,139,114,.28)}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@keyframes iconpop{0%{transform:scale(.3) rotate(-30deg)}55%{transform:scale(1.45) rotate(10deg)}100%{transform:none}}
@keyframes navflash{0%{box-shadow:0 0 0 0 rgba(232,163,61,.75)}100%{box-shadow:0 0 0 16px rgba(232,163,61,0)}}
@keyframes barin{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.side nav button.pop{animation:navflash .7s ease-out}
.side nav button.pop svg{opacity:1;animation:iconpop .6s cubic-bezier(.3,1.5,.5,1)}
.side nav button.on::before{animation:barin .4s ease-out}

/* Transición editorial entre secciones: paneles escalonados + título con máscara + contador */
.curtain{position:fixed;inset:0 0 0 248px;z-index:25;overflow:hidden;pointer-events:all}
.ct-strips{position:absolute;inset:0;display:flex}
.ct-strips i{flex:1;transform:translateY(101%);will-change:transform;background:linear-gradient(180deg,#0a2a2f 0%,#0b3a3d 100%)}
.ct-strips i:nth-child(2){background:linear-gradient(180deg,#0b3034,#0c4143)}
.ct-strips i:nth-child(3){background:linear-gradient(180deg,#0c363a,#0d4a49)}
.ct-strips i:nth-child(4){background:linear-gradient(180deg,#0b2d32,#0c4442)}
.curtain.in .ct-strips i{transform:none;transition:transform .45s cubic-bezier(.76,0,.24,1)}
.curtain.in .ct-strips i:nth-child(2){transition-delay:.05s}
.curtain.in .ct-strips i:nth-child(3){transition-delay:.1s}
.curtain.in .ct-strips i:nth-child(4){transition-delay:.15s}
.curtain.out .ct-strips i{transform:translateY(-101%);transition:transform .5s cubic-bezier(.76,0,.24,1)}
.curtain.out .ct-strips i:nth-child(2){transition-delay:.05s}
.curtain.out .ct-strips i:nth-child(3){transition-delay:.1s}
.curtain.out .ct-strips i:nth-child(4){transition-delay:.15s}
.ct-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:26px max(7vw,24px) 30px;color:#fff;opacity:0;
 background:radial-gradient(700px 380px at 15% 105%,rgba(20,147,122,.35),transparent 65%),radial-gradient(520px 300px at 100% 0,rgba(232,163,61,.14),transparent 60%)}
.ct-in::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(circle at 30% 60%,#000 0,transparent 75%);mask-image:radial-gradient(circle at 30% 60%,#000 0,transparent 75%)}
.curtain.in .ct-in{opacity:1;transition:opacity .25s .3s}
.curtain.out .ct-in{opacity:0;transition:opacity .2s}
.ct-top,.ct-foot{position:relative;display:flex;justify-content:space-between;align-items:center;font-size:.7rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.ct-top b{color:var(--acc);font-weight:700}
.ct-main{position:relative}
.ct-num{position:absolute;right:-2vw;top:50%;transform:translateY(-52%);font-size:clamp(9rem,46vw,17rem);font-weight:700;letter-spacing:-.06em;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.13);opacity:0;pointer-events:none}
.curtain.in .ct-num{opacity:1;transform:translateY(-52%);transition:opacity .8s .45s}
.ct-ic{position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:16px;margin-bottom:26px;color:#fff;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);opacity:0;transform:scale(.8)}
.curtain.in .ct-ic{opacity:1;transform:none;transition:opacity .4s .4s,transform .6s .4s cubic-bezier(.2,.9,.3,1.2)}
.ct-ic svg{width:26px;height:26px;stroke-width:1.5}
.ct-ic svg *{stroke-dasharray:1;stroke-dashoffset:1}
.curtain.in .ct-ic svg *{animation:ctdraw .9s .55s cubic-bezier(.4,0,.2,1) forwards}
.ct-kick{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:.72rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.ct-kick::before{content:"";width:0;height:2px;background:var(--acc);border-radius:2px}
.curtain.in .ct-kick::before{width:36px;transition:width .6s .5s cubic-bezier(.2,.8,.2,1)}
.ct-h{overflow:hidden;padding-bottom:.12em}
.ct-h span{display:block;font-size:clamp(2.1rem,9.5vw,3.6rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;transform:translateY(112%)}
.curtain.in .ct-h span{transform:none;transition:transform .75s .5s cubic-bezier(.2,.8,.2,1)}
.ct-line{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;margin-right:18px}
.ct-line i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));transform-origin:left;transform:scaleX(0)}
.curtain.in .ct-line i{animation:ctfill .8s .4s cubic-bezier(.65,0,.35,1) forwards}
.ct-pct{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums;color:#fff}
@keyframes ctfill{to{transform:scaleX(1)}}
@keyframes ctdraw{to{stroke-dashoffset:0}}
.snd{display:grid;place-items:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--pri2);transition:background .2s,color .2s;width:auto}
.snd:hover{background:var(--pri3)}.snd.off{color:var(--mut)}
@media(max-width:820px){.curtain{inset:0}}
#view.pre>*{animation:none;opacity:0}
.land{padding:44px 36px}.land h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.12;max-width:640px}.land h1 em{font-style:normal;color:var(--acc)}
.land .kick{display:inline-block;margin-bottom:14px;font-size:.7rem;font-weight:700;letter-spacing:.22em;color:#bfe9df}.land .row{position:relative;z-index:1}
.live{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}@media(max-width:720px){.live{grid-template-columns:1fr}}
#hout{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}.donut{width:190px;height:190px}.donut circle{transition:stroke-dasharray .5s,stroke-dashoffset .5s}
.dk{font:700 26px Inter,sans-serif;fill:var(--ink)}.dl{font:500 9px Inter,sans-serif;fill:var(--mut)}
.leg div{display:flex;align-items:center;gap:8px;margin:6px 0}.leg i{width:12px;height:12px;border-radius:4px;display:inline-block}.leg small{display:block;margin-top:8px;max-width:210px}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:18px}
.feat{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s,border-color .25s;font:inherit;color:var(--ink)}
.feat:hover{transform:translateY(-5px);box-shadow:var(--shh);border-color:var(--pri)}.feat i{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--pri3);color:var(--pri2);margin-bottom:12px;font-style:normal}
.feat b{display:block;margin-bottom:4px}.feat span{color:var(--mut);font-size:.86rem}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="logo"><b><svg class="i" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z"/><path d="M2 21c0-3 1.9-5.4 5-6"/></svg></b><div>Nutri<span>Pro</span></div></div>
  <nav id="nav"></nav>
  <small>v0.7 · datos guardados solo en este navegador</small>
</aside>
<div class="main">
  <div class="top">
    <button class="burger" onclick="$('side').classList.toggle('open')"><svg class="i" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <div><label style="margin:0">Paciente activo</label><select id="curP" onchange="setCur(this.value)"></select></div>
    <label class="sw"><input type="checkbox" id="stu" onchange="setStudent(this.checked)"> Modo estudiante</label>
    <label class="sw" style="margin-left:0"><input type="checkbox" id="anm" onchange="S.anim=this.checked;S.animSet=true;save();applyFM()"> Animaciones</label>
    <button class="snd" id="snd" onclick="toggleSound()" aria-label="Sonido de transiciones"></button>
  </div>
  <div id="banner"></div>
  <div id="view"></div>
</div>

<script>
'use strict';
/* ========== Utilidades ========== */
const $=id=>document.getElementById(id);
const KEY='nutripro_v2';
const DEF={patients:[],records:[],calcs:[],consults:[],foods:[],groups:[],recipes:[],plans:{},cur:null,view:'home',student:false,sound:true,prof:'',nid:1,showArch:false,editP:null,recSel:null,lastBackup:null,appts:[],labs:[],acts:[],week:{},anim:true,recall:[],somato:[],logo:''};
const LS=(()=>{try{return window.localStorage}catch(e){return null}})();
let S;
try{const raw=JSON.parse(LS.getItem(KEY)||'{}');S=Object.assign({},DEF,raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{})}

function validate(d,need){
  const e=[];
  for(const k of need){
    if(k==='sex'){if(!d.sex)e.push('Falta el sexo.');continue}
    const v=d[k];
    if(v===null||v===undefined)e.push(`Falta ${NAMES[k]||k}.`);
    else if(isNaN(v)||v<=0)e.push(`${NAMES[k]||k} debe ser un número mayor que cero.`);
  }
  if(d.w>500||d.h>260||d.age>120)e.push('Algún valor es imposible (revisa las unidades).');
  if(d.ffm&&d.w&&d.ffm>=d.w)e.push('La masa libre de grasa no puede ser mayor o igual al peso.');
  return e;
}

    if(g.k==null||g.c==null||g.p==null||g.f==null){o.exMiss=true;return o}
    o.k=g.k*it.n;o.c=g.c*it.n;o.p=g.p*it.n;o.f=g.f*it.n;o.fbMiss=true;return o}
  if(it.type==='rec'){const r=S.recipes.find(x=>x.id===it.rid);if(!r)return z();const t=recipeNut(r),q=it.por/r.portions;return {k:t.k*q,c:t.c*q,p:t.p*q,f:t.f*q,fb:t.fb*q,fbMiss:t.fbMiss,exMiss:false}}

}

/* Sonido sintetizado (Web Audio, sin archivos): sincronizado con la transición */
const SFX=(()=>{
  let ctx=null,master=null,noise=null;
  function init(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
      ctx=new AC();master=ctx.createGain();master.gain.value=.9;
      const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
      const len=ctx.sampleRate*1.5;noise=ctx.createBuffer(1,len,ctx.sampleRate);
      const d=noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }
    if(ctx.state==='suspended')ctx.resume();
    return true;
  }
  function whoosh(at,dur,f0,f1,vol){
    const s=ctx.createBufferSource();s.buffer=noise;
    const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=1.1;
    f.frequency.setValueAtTime(f0,at);f.frequency.exponentialRampToValueAtTime(f1,at+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(.0001,at);
    g.gain.exponentialRampToValueAtTime(vol,at+dur*.45);g.gain.exponentialRampToValueAtTime(.0001,at+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start(at,Math.random()*.4);s.stop(at+dur+.05);
  }
  function tone(at,dur,f0,type,vol,f1){
    const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,at);
    if(f1)o.frequency.exponentialRampToValueAtTime(f1,at+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(.0001,at);
    g.gain.exponentialRampToValueAtTime(vol,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+dur);
    o.connect(g);g.connect(master);o.start(at);o.stop(at+dur+.05);
  }
  return{
    init,
    blip(){if(!init())return;tone(ctx.currentTime,.18,880,'sine',.06)},
    play(){
      if(!S.sound||!init())return;
      const t=ctx.currentTime;
      whoosh(t,.5,350,2600,.22);                 /* los paneles suben */
      tone(t+.42,.4,95,'sine',.3,45);            /* golpe grave cuando cubren la pantalla */
      tone(t+.52,.12,1320,'triangle',.045);      /* aparece el título */
      [523.25,587.33,659.25,783.99,880].forEach((f,i)=>tone(t+.55+i*.14,.2,f,'sine',.035)); /* progreso */
      tone(t+1.2,.8,784,'sine',.06);tone(t+1.2,.9,1046.5,'sine',.08); /* carga completa */
      whoosh(t+1.5,.6,2400,380,.17);             /* los paneles se retiran */
    }
  };
})();

  const planes=Object.values(S.plans).filter(pl=>pl.meals.some(m=>m.items.length)).length;
  return `<div class="hero"><h1>Panel de control</h1><p>Gestiona pacientes, calcula requerimientos y construye planes alimentarios con procedimiento verificable.</p></div>
  <div class="stats"><div class="stat"><b>${act.length}</b><span>Pacientes / casos</span></div><div class="stat"><b>${S.consults.length}</b><span>Consultas</span></div><div class="stat"><b>${planes}</b><span>Planes con alimentos</span></div><div class="stat"><b>${S.foods.length}</b><span>Alimentos</span></div><div class="stat"><b>${S.recipes.length}</b><span>Recetas</span></div></div>
  ${alertsHtml()}<div class="card"><h3>Acceso rápido</h3><div class="quick">${MENU.slice(2).map(([k,i,t])=>`<button onclick="go('${k}')"><i>${i}</i>${t}</button>`).join('')}</div></div>
  <div class="card"><h3>Pacientes recientes</h3>${act.length?`<table><tbody>${act.slice(-5).reverse().map(p=>`<tr><td>${esc(p.name)} ${p.academic?'<span class="tag">académico</span>':''}</td><td class="mut">${esc(p.goal||'')}</td><td><button class="btn sm sec" onclick="setCur(${p.id});go('antro')">Abrir</button></td></tr>`).join('')}</tbody></table>`:'<p class="mut">Aún no hay pacientes. Estudiantes: crea un caso académico ficticio.</p>'}</div>`;
};

AFTER.dash=()=>{
  document.querySelectorAll('.stat b').forEach(el=>{
    const to=parseInt(el.textContent,10)||0,t0=performance.now(),dur=700;
    (function tick(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(tick)})(t0);
  });
};

/* ========== Pacientes ========== */
VIEWS.patients=()=>{
  const e=S.patients.find(p=>p.id===S.editP)||{};
  const list=S.patients.filter(p=>S.showArch?p.archived:!p.archived);
  return `<h2 class="pt">Pacientes</h2>
  <div class="card"><h3>${e.id?'Editar ficha':'Nueva ficha'}</h3>
  <div class="grid">
   <div><label>Nombre *</label><input id="pn" value="${esc(e.name)}"></div>
   <div><label>Fecha de nacimiento *</label><input id="pb" type="date" value="${esc(e.birth)}" max="${today()}"></div>
   <div><label>Sexo (para ecuaciones) *</label><select id="ps"><option value="">Seleccionar…</option><option value="M" ${e.sex==='M'?'selected':''}>Masculino</option><option value="F" ${e.sex==='F'?'selected':''}>Femenino</option></select></div>
   <div><label>Objetivo nutricional</label><input id="pg" value="${esc(e.goal)}"></div>
   <div><label>Nivel de actividad física</label><input id="pa" value="${esc(e.act)}"></div>
   <div><label>Alergias e intolerancias</label><input id="pal" value="${esc(e.allergies)}"></div>
  </div>
  <div class="grid" style="margin-top:10px"><div><label>Antecedentes y hábitos alimentarios</label><textarea id="ph">${esc(e.history)}</textarea></div><div><label>Observaciones profesionales</label><textarea id="po">${esc(e.notes)}</textarea></div></div>
  <div class="row"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="pac" style="width:auto" ${e.academic?'checked':''}> Caso académico (ficticio, sin datos reales)</label>
  <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="pc" style="width:auto" ${e.consent?'checked':''}> Consentimiento informado obtenido (paciente real)</label></div>
  <div class="row"><button class="btn" onclick="savePatient()">Guardar</button>${e.id?'<button class="btn sec" onclick="S.editP=null;render()">Cancelar</button>':''}</div><div id="oP"></div></div>
  <div class="card"><div class="row" style="margin:0 0 8px"><h3 style="margin:0">${S.showArch?'Archivados':'Lista'}</h3><button class="btn sm sec" style="margin-left:auto" onclick="S.showArch=!S.showArch;render()">${S.showArch?'Ver activos':'Ver archivados'}</button></div>
  <div class="scroll"><table><thead><tr><th>Nombre</th><th>Edad</th><th>Objetivo</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td>${esc(p.name)} ${p.academic?'<span class="tag">académico</span>':''}</td><td>${p.birth?ageOf(p.birth)+' años':'—'}</td><td>${esc(p.goal||'—')}</td><td style="white-space:nowrap">${p.archived?`<button class="btn sm sec" onclick="archP(${p.id},false)">Restaurar</button>`:`<button class="btn sm" onclick="setCur(${p.id});go('antro')">Abrir</button> <button class="btn sm sec" onclick="S.editP=${p.id};render()">Editar</button> <button class="btn sm sec" onclick="archP(${p.id},true)">Archivar</button>`}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Sin registros.</td></tr>'}</tbody></table></div></div>`;
};
function savePatient(){
  const name=V('pn'),birth=V('pb'),sex=V('ps'),ac=$('pac').checked,cons=$('pc').checked,e=[];
  if(!name)e.push('Falta el nombre.');
  if(!birth)e.push('Falta la fecha de nacimiento.');else if(birth>today())e.push('La fecha de nacimiento no puede ser futura.');else if(ageOf(birth)>120)e.push('Fecha de nacimiento imposible.');
  if(!sex)e.push('Selecciona el sexo.');
  if(!ac&&!cons)e.push('Para un paciente real debes registrar el consentimiento informado (o marcar el caso como académico).');
  if(e.length)return $('oP').innerHTML=e.map(x=>msg(x,'err')).join('');
  const data={name,birth,sex,goal:V('pg'),act:V('pa'),allergies:V('pal'),history:V('ph'),notes:V('po'),academic:ac,consent:cons};
  if(S.editP){Object.assign(S.patients.find(p=>p.id===S.editP),data);S.editP=null}
  else{const id=uid();S.patients.push(Object.assign({id,archived:false,created:today()},data));S.cur=id}
  save();render();
}
function archP(id,a){
  if(a&&!confirm('El paciente se archivará (no se borra) y sus datos se conservan. ¿Continuar?'))return;
  S.patients.find(p=>p.id===id).archived=a;if(a&&S.cur===id)S.cur=null;save();render();
}

/* ========== Consultas ========== */
VIEWS.consults=()=>{
  const p=P();if(!p)return `<h2 class="pt">Consultas</h2>`+needP();
  const l=S.consults.filter(c=>c.pid===p.id).sort((a,b)=>b.date.localeCompare(a.date));
  return `<h2 class="pt">Consultas — ${esc(p.name)}</h2>
  <div class="card"><h3>Nueva consulta</h3><div class="grid"><div><label>Fecha *</label><input id="cd" type="date" value="${today()}" max="${today()}"></div><div><label>Motivo *</label><input id="cm"></div></div>
  <div style="margin-top:10px"><label>Notas de la consulta</label><textarea id="cn"></textarea></div>
  <div class="row"><button class="btn" onclick="saveConsult()">Guardar consulta</button></div><div id="oC"></div></div>
  <div class="card"><h3>Historial</h3>${l.map(c=>`<div style="border-bottom:1px solid var(--line);padding:8px 0"><b>${c.date}</b> — ${esc(c.motive)}<br><small>${esc(c.notes||'')}</small> <small class="mut">· ${esc(c.by)}</small> <button class="x" onclick="delConsult(${c.id})">&times;</button></div>`).join('')||'<p class="mut">Sin consultas.</p>'}</div>`;
};
function saveConsult(){
  const p=P(),d=V('cd'),m=V('cm'),e=[];
  if(!d)e.push('Falta la fecha.');else if(d>today())e.push('La fecha no puede ser futura.');
  if(!m)e.push('Falta el motivo.');
  if(e.length)return $('oC').innerHTML=e.map(x=>msg(x,'err')).join('');
  S.consults.push({id:uid(),pid:p.id,date:d,motive:m,notes:V('cn'),by:who(),at:new Date().toISOString()});save();render();
}

/* ========== Antropometría ========== */
VIEWS.antro=()=>{
  const p=P();if(!p)return `<h2 class="pt">Antropometría</h2>`+needP();
  const rs=[...recsOf(p.id)].reverse();
  return `<h2 class="pt">Antropometría — ${esc(p.name)}</h2>
  <div class="card"><h3>Nueva medición</h3><p class="hint">Las mediciones no se sobrescriben: para corregir, registra una nueva. Deja vacío lo que no mediste (queda como "sin dato").</p>
  <div class="grid"><div><label>Fecha *</label><input id="ad" type="date" value="${today()}" max="${today()}"></div><div><label>Peso kg *</label><input id="aw" type="number" step="0.1"></div><div><label>Talla cm *</label><input id="ah" type="number" step="0.1"></div><div><label>Cintura cm</label><input id="awa" type="number" step="0.1"></div><div><label>Cadera cm</label><input id="ahi" type="number" step="0.1"></div><div><label>Brazo cm</label><input id="aar" type="number" step="0.1"></div><div><label>% grasa corporal</label><input id="afp" type="number" step="0.1"></div><div><label>Método del % grasa</label><input id="afm" placeholder="Ej.: Durnin-Womersley"></div></div>
  <div class="row"><button class="btn" onclick="saveRec()">Guardar medición</button></div><div id="oA"></div></div>
  <div class="card"><h3>Historial</h3><div class="scroll"><table><thead><tr><th>Fecha</th><th>Peso</th><th>Talla</th><th>IMC</th><th>Cintura</th><th>Cadera</th><th>ICC</th><th>Brazo</th><th>% grasa</th><th>M. grasa / MLG</th><th>Autor</th><th></th></tr></thead><tbody>${rs.map(r=>{const imc=r.w&&r.h?r.w/((r.h/100)**2):null,icc=r.wa&&r.hi?r.wa/r.hi:null,mg=r.fp!=null?r.w*r.fp/100:null;return `<tr><td>${r.date}</td><td>${f1(r.w)}</td><td>${r.h?f1(r.h):'sin dato'}</td><td>${imc?f1(imc):'—'}</td><td>${r.wa?f1(r.wa):'sin dato'}</td><td>${r.hi?f1(r.hi):'sin dato'}</td><td>${icc?f1(icc,2):'—'}</td><td>${r.ar?f1(r.ar):'sin dato'}</td><td>${r.fp!=null?f1(r.fp)+'%':'sin dato'}${r.fm?`<br><small>${esc(r.fm)}</small>`:''}</td><td>${mg!=null?f1(mg)+' / '+f1(r.w-mg)+' kg':'—'}</td><td class="mut">${esc(r.by)}</td><td><button class="x" onclick="delRec(${r.id})">&times;</button></td></tr>`}).join('')||'<tr><td colspan="12" class="mut">Sin mediciones.</td></tr>'}</tbody></table></div></div>
  ${rs[0]?`<div class="card"><h3>Última medición — cálculos con procedimiento</h3>${recSteps(rs[0])}</div>`:''}`;
};
function recSteps(r){
  let h='';
  if(r.w&&r.h){const m=r.h/100,b=r.w/(m*m);const cat=b<18.5?'Bajo peso':b<25?'Normopeso':b<30?'Sobrepeso':'Obesidad';
    h+=stepsHtml({name:'Índice de masa corporal',data:`peso ${r.w} kg; talla ${r.h} cm = ${m} m`,formula:'IMC = peso (kg) ÷ talla² (m²)',subst:`${r.w} ÷ (${m})²`,op:`${r.w} ÷ ${f1(m*m,4)}`,res:`${f1(b)} kg/m² — ${cat}`,ref:'OMS (clasificación para adultos)'})}
  if(r.wa&&r.hi)h+=stepsHtml({name:'Relación cintura/cadera',data:`cintura ${r.wa} cm; cadera ${r.hi} cm`,formula:'ICC = cintura ÷ cadera',subst:`${r.wa} ÷ ${r.hi}`,op:`${r.wa} ÷ ${r.hi}`,res:f1(r.wa/r.hi,2),ref:'OMS'});
  if(r.fp!=null)h+=stepsHtml({name:'Composición corporal (a partir del % de grasa registrado)',data:`peso ${r.w} kg; % grasa ${r.fp}% (${esc(r.fm||'método no indicado')})`,formula:'Masa grasa = peso × %grasa ÷ 100 · MLG = peso − masa grasa',subst:`${r.w} × ${r.fp} ÷ 100`,op:`MG = ${f1(r.w*r.fp/100,2)} kg; MLG = ${r.w} − ${f1(r.w*r.fp/100,2)}`,res:`MG ${f1(r.w*r.fp/100)} kg · MLG ${f1(r.w-r.w*r.fp/100)} kg`,ref:'El %grasa fue ingresado por el profesional; no se calculó aquí'});
  return h+msg('Clasificación de IMC válida para adultos; en niños, adolescentes, embarazo o adultos mayores se usan otros criterios.','warn');
}
function saveRec(){
  const p=P(),d=V('ad'),w=N('aw'),h=N('ah'),wa=N('awa'),hi=N('ahi'),ar=N('aar'),fp=N('afp'),e=[],w2=[];
  if(!d)e.push('Falta la fecha.');else if(d>today())e.push('La fecha no puede ser futura.');
  if(w===null||isNaN(w)||w<=0)e.push('Peso inválido (debe ser mayor que cero).');else if(w>300||w<20)w2.push('Peso fuera del rango habitual; verifica la unidad.');
  if(h===null||isNaN(h)||h<=0)e.push('Talla inválida (debe ser mayor que cero).');else if(h>230||h<50)w2.push('Talla fuera del rango habitual; verifica que esté en cm.');
  [['cintura',wa],['cadera',hi],['brazo',ar]].forEach(([t,v])=>{if(v!==null&&(isNaN(v)||v<=0))e.push(`Valor de ${t} inválido.`)});
  if(fp!==null&&(isNaN(fp)||fp<=0||fp>=100))e.push('% de grasa inválido.');
  if(e.length)return $('oA').innerHTML=e.map(x=>msg(x,'err')).join('');
  S.records.push({id:uid(),pid:p.id,date:d,w,h,wa,hi,ar,fp,fm:V('afm'),by:who(),at:new Date().toISOString()});save();render();
  if(w2.length)$('oA').innerHTML=w2.map(x=>msg(x,'warn')).join('');
}

/* ========== Requerimientos ========== */
let LAST={};
VIEWS.req=()=>{
  const p=P(),r=p?lastRec(p.id):null,age=p&&p.birth?ageOf(p.birth):'';
  const hist=p?S.calcs.filter(c=>c.pid===p.id).sort((a,b)=>b.at.localeCompare(a.at)):[];
  return `<h2 class="pt">Requerimientos</h2>
  ${p?msg(`Datos precargados de ${esc(p.name)} (último registro). Puedes editarlos.`,'info'):msg('Sin paciente activo: puedes calcular manualmente, pero para guardar el cálculo en un historial debes seleccionar un paciente.','info')}
  <div class="card"><h3>Datos</h3><div class="grid">
   <div><label>Sexo</label><select id="rsex"><option value="">Seleccionar…</option><option value="M" ${p&&p.sex==='M'?'selected':''}>Masculino</option><option value="F" ${p&&p.sex==='F'?'selected':''}>Femenino</option></select></div>
   <div><label>Edad (años)</label><input id="rage" type="number" value="${age}"></div>
   <div><label>Peso (kg)</label><input id="rw" type="number" step="0.1" value="${r?r.w:''}"></div>
   <div><label>Talla (cm)</label><input id="rh" type="number" step="0.1" value="${r&&r.h?r.h:''}"></div>
   <div><label>Masa libre de grasa (kg)</label><input id="rffm" type="number" step="0.1" value="${r&&r.fp!=null?f1(r.w-r.w*r.fp/100):''}"></div></div></div>
  <div class="card"><h3>Gasto energético</h3><div class="grid">
   <div><label>Método</label><select id="rm">${Object.entries(METHODS).map(([k,m])=>`<option value="${k}">${m.n}</option>`).join('')}</select></div>
   <div><label>Factor de actividad</label><select id="raf" onchange="$('rafc').parentNode.style.display=this.value==='c'?'block':'none'"><option value="1.2">1,2 Sedentario</option><option value="1.375">1,375 Ligera</option><option value="1.55" selected>1,55 Moderada</option><option value="1.725">1,725 Alta</option><option value="1.9">1,9 Muy alta</option><option value="c">Personalizado…</option></select></div>
   <div style="display:none"><label>Factor personalizado</label><input id="rafc" type="number" step="0.01"></div></div>
   <div class="row"><button class="btn" onclick="doEnergy()">Calcular TMB y GET</button></div><div id="oE"></div></div>
  <div class="card"><h3>Macronutrientes (% de energía)</h3><div class="grid">
   <div><label>Energía (kcal)</label><input id="mk" type="number"></div><div><label>% CHO</label><input id="mc" type="number" value="55" step="0.1"></div><div><label>% Proteína</label><input id="mp" type="number" value="15" step="0.1"></div><div><label>% Grasa</label><input id="mf" type="number" value="30" step="0.1"></div></div>
   <div class="row"><button class="btn" onclick="doMacro()">Calcular gramos</button></div><div id="oM"></div></div>
  ${p?`<div class="card"><h3>Historial de cálculos guardados</h3><div class="scroll"><table><thead><tr><th>Fecha</th><th>Método</th><th>Versión</th><th>Resultado</th><th>Datos usados</th><th>Autor</th></tr></thead><tbody>${hist.map(c=>`<tr><td>${localDay(c.at)}</td><td>${esc(c.method)}</td><td>${esc(c.version)}</td><td>${esc(c.result)}</td><td><small>${esc(c.inputs)}</small></td><td class="mut">${esc(c.by)}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Aún no hay cálculos guardados.</td></tr>'}</tbody></table></div></div>`:''}`;
};
function doEnergy(){
  const key=V('rm'),m=METHODS[key];
  const d={sex:V('rsex'),age:N('rage'),w:N('rw'),h:N('rh'),ffm:N('rffm')};
  const e=validate(d,m.need);
  let af=V('raf')==='c'?N('rafc'):Number(V('raf'));
  if(af===null||isNaN(af)||af<=0)e.push('Factor de actividad inválido.');
  if(m.minAge&&d.age!==null&&d.age<m.minAge)e.push(`Este método aplica a personas de ${m.minAge} años o más.`);
  if(e.length)return $('oE').innerHTML=e.map(x=>msg(x,'err')).join('');
  const r=m.f(d),get=r.v*af;
  const used=m.need.map(k=>`${NAMES[k]}=${d[k]}`).join('; ')+`; FA=${af}`;
  LAST.energy={method:m.n,version:ENGINE_VERSION,result:`TMB ${f1(r.v,0)} kcal/día · GET ${f1(get,0)} kcal/día`,inputs:used,value:get};
  $('mk').value=Math.round(get);
  $('oE').innerHTML=stepsHtml({name:m.n,data:used,formula:r.formula+' → GET = TMB × FA',subst:r.subst,op:`TMB = ${f1(r.v)}; GET = ${f1(r.v)} × ${af}`,res:LAST.energy.result,ref:m.ref})+
   (d.age!==null&&d.age<18?msg('Las ecuaciones incluidas están pensadas para adultos.','warn'):'')+msg('Es una estimación; ninguna ecuación es apropiada para todos los casos.','warn')+
   (P()?`<div class="row"><button class="btn sec" onclick="saveCalc('energy')">Guardar en el historial del paciente</button></div>`:'');
}
function doMacro(){
  const k=N('mk'),c=N('mc'),p=N('mp'),f=N('mf'),e=[];
  if(!k||isNaN(k)||k<=0)e.push('Ingresa una energía mayor que cero.');
  [c,p,f].forEach((v,i)=>{if(v===null||isNaN(v)||v<0)e.push(`Porcentaje inválido: ${['carbohidratos','proteínas','grasas'][i]}.`)});
  if(!e.length&&Math.abs(c+p+f-100)>0.05)e.push(`Los porcentajes suman ${f1(c+p+f)}%; deben sumar 100%.`);
  if(e.length)return $('oM').innerHTML=e.map(x=>msg(x,'err')).join('');
  const gc=k*c/100/4,gp=k*p/100/4,gf=k*f/100/9;
  LAST.macro={method:'Distribución por % de energía (Atwater 4/4/9)',version:ENGINE_VERSION,result:`CHO ${f1(gc,0)} g · PRO ${f1(gp,0)} g · GRASA ${f1(gf,0)} g`,inputs:`${k} kcal; ${c}/${p}/${f} %`,k,c:gc,p:gp,f:gf};
  const w=N('rw');
  $('oM').innerHTML=stepsHtml({name:LAST.macro.method,data:LAST.macro.inputs,formula:'g CHO = kcal×%÷4 · g PRO = kcal×%÷4 · g GRASA = kcal×%÷9',subst:`CHO ${k}×${c/100}÷4; PRO ${k}×${p/100}÷4; GRASA ${k}×${f/100}÷9`,op:`CHO ${f1(k*c/100,0)}÷4; PRO ${f1(k*p/100,0)}÷4; GRASA ${f1(k*f/100,0)}÷9`,res:LAST.macro.result})+
   (w>0?`<div class="msg info">Referencia por peso: proteína ${f1(gp/w,2)} g/kg · CHO ${f1(gc/w,2)} g/kg · grasa ${f1(gf/w,2)} g/kg</div>`:'')+
   `<div class="row">${P()?`<button class="btn sec" onclick="saveCalc('macro')">Guardar en el historial</button><button class="btn" onclick="toPlan()">Usar como objetivo del plan</button>`:''}</div>`;
}
function saveCalc(t){
  const c=LAST[t];if(!c||!P())return;
  S.calcs.push({id:uid(),pid:S.cur,method:c.method,version:c.version,inputs:c.inputs,result:c.result,by:who(),at:new Date().toISOString()});save();
  const el=$(t==='energy'?'oE':'oM');el.insertAdjacentHTML('beforeend',msg('Cálculo guardado con método, versión, datos, resultado, fecha y autor.','ok'));
}
function toPlan(){
  const m=LAST.macro;if(!m||!P())return;
  const pl=planOf(S.cur);pl.target={k:Math.round(m.k),c:Math.round(m.c),p:Math.round(m.p),f:Math.round(m.f)};save();go('plan');
}

/* ========== Alimentos ========== */
VIEWS.foods=()=>`<h2 class="pt">Alimentos</h2>
  <div class="card"><h3>Agregar alimento (valores por 100 g)</h3><p class="hint">No hay valores precargados. Ingresa solo datos de una fuente verificable y regístrala. Lo que dejes vacío queda como "sin dato", nunca como 0.</p>
  <div class="grid"><div><label>Nombre *</label><input id="fn"></div><div><label>Categoría</label><input id="fg"></div><div><label>Energía kcal *</label><input id="fk" type="number" step="0.1"></div><div><label>Proteína g *</label><input id="fp" type="number" step="0.1"></div><div><label>Carbohidratos g *</label><input id="fc" type="number" step="0.1"></div><div><label>Grasa g *</label><input id="ff" type="number" step="0.1"></div><div><label>Fibra g</label><input id="fb" type="number" step="0.1"></div><div><label>Sodio mg</label><input id="fs" type="number" step="0.1"></div><div><label>Fuente *</label><input id="fsrc" placeholder="Ej.: USDA FDC, ID …"></div><div><label>Versión/fecha de la fuente</label><input id="fv"></div></div>
  <div class="row"><button class="btn" onclick="addFood()">Guardar alimento</button></div><div id="oF"></div></div>
  <div class="card"><h3>Buscar alimentos en línea (USDA)</h3><p class="hint">Escribe el alimento en español y toca Agregar: los valores y la fuente se guardan solos, sin escribir nada más. Necesita internet.</p><div class="row" style="margin-top:0"><div style="flex:1;min-width:180px"><input id="us" placeholder="Ej.: arroz cocido, pechuga de pollo, manzana" onkeydown="if(event.key==='Enter')searchUSDA()"></div><button class="btn" onclick="searchUSDA()">Buscar</button></div><div id="oUS"></div><details style="margin-top:10px"><summary class="mut" style="cursor:pointer">Clave propia de USDA (opcional, si se acaban las búsquedas)</summary><input id="uk" placeholder="Pega tu clave gratuita de api.data.gov" value="${esc(S.usdaKey||'')}" onchange="S.usdaKey=this.value.trim();save()" style="margin-top:8px"></details></div>
  <div class="card"><h3>Importar alimentos desde CSV / Excel</h3><p class="hint">Prepara tu tabla con tu fuente verificable (nombre, categoría, kcal, proteína, CHO, grasa, fibra, sodio, fuente; valores por 100 g). En Excel guárdala como CSV. Las filas con errores se omiten y te digo cuáles.</p><div class="row" style="margin-top:0"><button class="btn sec sm" onclick="downloadTemplate()">Descargar plantilla</button><input type="file" accept=".csv,text/csv" style="width:auto" onchange="importFoods(this)"></div><label style="margin-top:12px">O pega aquí las filas (copiadas de Excel, Google Sheets o una tabla), con el encabezado</label><textarea id="paste" placeholder="nombre	categoria	kcal	proteina	cho	grasa	fibra	sodio	fuente"></textarea><div class="row"><button class="btn sm" onclick="importFoodsText(V('paste'))">Importar lo pegado</button></div><div id="oImp"></div></div>
  <div class="card"><h3>Mis alimentos</h3><input id="fq" placeholder="Buscar…" oninput="renderFoodRows()" style="margin-bottom:8px"><div class="scroll"><table><thead><tr><th>Alimento</th><th>kcal</th><th>P</th><th>CHO</th><th>G</th><th>Fibra</th><th>Medidas caseras</th><th>Fuente</th><th></th></tr></thead><tbody id="fRows"></tbody></table></div></div>`;
AFTER.foods=()=>renderFoodRows();
function renderFoodRows(){
  const q=($('fq')?$('fq').value:'').toLowerCase();
  $('fRows').innerHTML=S.foods.filter(x=>x.n.toLowerCase().includes(q)||(x.g||'').toLowerCase().includes(q)).map(x=>`<tr><td>${esc(x.n)}<br><small>${esc(x.g||'')}</small></td><td>${x.k}</td><td>${x.p}</td><td>${x.c}</td><td>${x.f}</td><td>${x.fb??'sin dato'}</td><td>${(x.measures||[]).map(m=>`${esc(m.label)} = ${m.g} g <button class="x" onclick="delMeasure(${x.id},'${esc(m.label)}')">&times;</button>`).join('<br>')||'<small>—</small>'}<br><button class="btn sm sec" onclick="addMeasure(${x.id})">+ medida</button></td><td><small>${esc(x.src)} ${esc(x.sv||'')}</small></td><td><button class="x" title="Eliminar" onclick="delFood(${x.id})">&times;</button></td></tr>`).join('')||'<tr><td colspan="9" class="mut">Sin alimentos.</td></tr>';
}
function addFood(){
  const n=V('fn'),src=V('fsrc'),k=N('fk'),p=N('fp'),c=N('fc'),f=N('ff'),fb=N('fb'),na=N('fs'),e=[];
  if(!n)e.push('Falta el nombre.');if(!src)e.push('La fuente es obligatoria.');
  [['energía',k],['proteína',p],['carbohidratos',c],['grasa',f]].forEach(([t,v])=>{if(v===null||isNaN(v)||v<0)e.push(`Valor de ${t} inválido o vacío.`)});
  [['fibra',fb],['sodio',na]].forEach(([t,v])=>{if(v!==null&&(isNaN(v)||v<0))e.push(`Valor de ${t} inválido.`)});
  if(!e.length&&(p*4+c*4+f*9)>k*1.5+20)e.push('La energía no concuerda con los macronutrientes (P·4 + CHO·4 + G·9). Revisa los datos.');
  if(e.length)return $('oF').innerHTML=e.map(x=>msg(x,'err')).join('');
  S.foods.push({id:uid(),n,g:V('fg'),k,p,c,f,fb,na,src,sv:V('fv'),measures:[]});save();render();
}
function addMeasure(id){
  const f=S.foods.find(x=>x.id===id),l=prompt(`Medida casera para "${f.n}" (ej.: taza, cucharada, unidad):`);if(!l||!l.trim())return;
  const g=Number((prompt(`¿Cuántos gramos (o ml) equivale 1 ${l.trim()}? Usa el dato de tu fuente.`)||'').replace(',','.'));
  if(!g||g<=0)return alert('Cantidad inválida. No se guardó la medida.');
  f.measures=(f.measures||[]).filter(m=>m.label!==l.trim());f.measures.push({label:l.trim(),g});save();renderFoodRows();
}
function delMeasure(id,l){const f=S.foods.find(x=>x.id===id);f.measures=f.measures.filter(m=>m.label!==l);save();renderFoodRows()}
function delFood(id){
  if(!confirm('¿Eliminar este alimento? Se quitará también de planes, recetas e intercambios.'))return;
  S.foods=S.foods.filter(x=>x.id!==id);S.groups.forEach(g=>g.items=g.items.filter(i=>i.fid!==id));S.recipes.forEach(r=>r.ings=r.ings.filter(i=>i.fid!==id));
  Object.values(S.plans).forEach(pl=>pl.meals.forEach(m=>m.items=m.items.filter(i=>!(i.type==='food'&&i.fid===id))));save();render();
}
const foodOpts=()=>S.foods.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('');

/* ========== Intercambios y equivalencias ========== */
VIEWS.exch=()=>`<h2 class="pt">Intercambios y equivalencias</h2>
  <div class="card"><h3>Nuevo grupo de intercambio</h3><p class="hint">Define tu propia lista. Los valores de referencia por 1 intercambio los pones tú (según el sistema que uses); si los dejas vacíos, el grupo no aportará nutrientes al plan.</p>
  <div class="grid"><div><label>Nombre *</label><input id="gn" placeholder="Cereales, Frutas…"></div><div><label>kcal / intercambio</label><input id="gk" type="number" step="0.1"></div><div><label>CHO g</label><input id="gc" type="number" step="0.1"></div><div><label>Proteína g</label><input id="gp" type="number" step="0.1"></div><div><label>Grasa g</label><input id="gf" type="number" step="0.1"></div></div>
  <div class="row"><button class="btn" onclick="addGroup()">Crear grupo</button></div><div id="oG"></div></div>
  ${S.groups.map(g=>`<div class="card"><h3 style="display:flex;justify-content:space-between">${esc(g.name)} <button class="x" onclick="delGroup(${g.id})">&times;</button></h3>
   <p class="hint">1 intercambio = ${g.k??'sin dato'} kcal · CHO ${g.c??'—'} g · PRO ${g.p??'—'} g · GRASA ${g.f??'—'} g</p>
   <div class="row" style="margin:0 0 8px"><div><label>Alimento</label><select id="gfd${g.id}">${foodOpts()}</select></div><div><label>Gramos por 1 intercambio</label><input id="gfa${g.id}" type="number" step="0.1" style="width:130px"></div><button class="btn sm" onclick="addGItem(${g.id})">Agregar</button></div>
   <div class="row" style="margin:0 0 8px"><div><label>Calcular</label><select id="gn${g.id}"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option><option value="c">Otra…</option></select></div><div><label>Personalizado</label><input id="gnc${g.id}" type="number" step="0.1" style="width:100px"></div><button class="btn sm sec" onclick="calcEx(${g.id})">Calcular cantidades</button></div>
   <div id="gout${g.id}"></div>
   <table><tbody>${g.items.map((i,ix)=>{const f=S.foods.find(x=>x.id===i.fid);return f?`<tr><td>${esc(f.n)}</td><td>${i.g} g = 1 intercambio</td><td><button class="x" onclick="delGItem(${g.id},${ix})">&times;</button></td></tr>`:''}).join('')||'<tr><td class="mut">Sin alimentos.</td></tr>'}</tbody></table></div>`).join('')}
  <div class="card"><h3>Sustitución entre alimentos</h3><p class="hint">Busca la cantidad del sustituto que aporta lo mismo que el original según el criterio. Es una equivalencia matemática, no clínica.</p>
  <div class="grid"><div><label>Original</label><select id="eA">${foodOpts()}</select></div><div><label>Gramos</label><input id="eG" type="number" value="100"></div><div><label>Sustituto</label><select id="eB">${foodOpts()}</select></div><div><label>Criterio</label><select id="eC"><option value="k">Energía</option><option value="c">Carbohidratos</option><option value="p">Proteína</option><option value="f">Grasa</option></select></div></div>
  <div class="row"><button class="btn" onclick="doEq()">Calcular equivalente</button></div><div id="oQ"></div></div>`;
function addGroup(){
  const n=V('gn'),vals=['gk','gc','gp','gf'].map(N),e=[];
  if(!n)e.push('Falta el nombre.');
  vals.forEach(v=>{if(v!==null&&(isNaN(v)||v<0))e.push('Valor de referencia inválido.')});
  if(e.length)return $('oG').innerHTML=[...new Set(e)].map(x=>msg(x,'err')).join('');
  S.groups.push({id:uid(),name:n,k:vals[0],c:vals[1],p:vals[2],f:vals[3],items:[]});save();render();
}
function delGroup(id){if(confirm('¿Eliminar este grupo? Se quitará de los planes.')){S.groups=S.groups.filter(g=>g.id!==id);Object.values(S.plans).forEach(pl=>pl.meals.forEach(m=>m.items=m.items.filter(i=>!(i.type==='ex'&&i.gid===id))));save();render()}}
function addGItem(id){const g=S.groups.find(x=>x.id===id),fid=Number(V('gfd'+id)),a=N('gfa'+id);if(!fid)return alert('Primero agrega alimentos.');if(!a||a<=0)return alert('Ingresa los gramos por intercambio (mayor que cero).');g.items.push({fid,g:a});save();render()}
function delGItem(id,ix){S.groups.find(x=>x.id===id).items.splice(ix,1);save();render()}
function calcEx(id){
  const g=S.groups.find(x=>x.id===id);let n=V('gn'+id)==='c'?N('gnc'+id):Number(V('gn'+id));
  if(!n||isNaN(n)||n<=0)return $('gout'+id).innerHTML=msg('Cantidad de intercambios inválida.','err');
  $('gout'+id).innerHTML=`<div class="steps"><div><b>${n} intercambio(s) de ${esc(g.name)}</b></div>${g.k!=null?`<div>Aporte de referencia: ${f1(g.k*n)} kcal · CHO ${g.c!=null?f1(g.c*n):'—'} g · PRO ${g.p!=null?f1(g.p*n):'—'} g · GRASA ${g.f!=null?f1(g.f*n):'—'} g</div>`:'<div>Sin valores de referencia en el grupo.</div>'}${g.items.map(i=>{const f=S.foods.find(x=>x.id===i.fid);return f?`<div>• ${esc(f.n)}: <b>${f1(i.g*n)} g</b></div>`:''}).join('')}</div>`;
}
function doEq(){
  const A=S.foods.find(x=>x.id==V('eA')),B=S.foods.find(x=>x.id==V('eB')),g=N('eG'),c=V('eC');
  if(!A||!B)return $('oQ').innerHTML=msg('Agrega al menos dos alimentos.','err');
  if(!g||isNaN(g)||g<=0)return $('oQ').innerHTML=msg('Ingresa una cantidad mayor que cero.','err');
  if(!B[c])return $('oQ').innerHTML=msg('El sustituto aporta 0 en ese criterio: no se puede calcular.','err');
  const gb=A[c]*g/100/B[c]*100,a=foodNut(A,g),b=foodNut(B,gb);
  const row=(l,x,y)=>`<tr><td>${l}</td><td>${f1(x)}</td><td>${f1(y)}</td><td>${y-x>=0?'+':''}${f1(y-x)}</td></tr>`;
  $('oQ').innerHTML=`<div class="steps"><div><b>${f1(gb,0)} g de ${esc(B.n)}</b> equivalen a ${f1(g,0)} g de ${esc(A.n)} (criterio: ${$('eC').selectedOptions[0].text}).</div></div><div class="scroll"><table><thead><tr><th></th><th>Original</th><th>Sustituto</th><th>Diferencia</th></tr></thead><tbody>${row('Cantidad (g)',g,gb)}${row('kcal',a.k,b.k)}${row('CHO g',a.c,b.c)}${row('Proteína g',a.p,b.p)}${row('Grasa g',a.f,b.f)}</tbody></table></div>`+msg('Equivalencia matemática según el criterio elegido; no implica equivalencia clínica. El profesional decide si la acepta.','warn');
}

/* ========== Plan alimentario ========== */
function planOf(pid){if(!S.plans[pid])S.plans[pid]={target:{k:'',c:'',p:'',f:''},recs:'',meals:[{id:uid(),name:'Desayuno',items:[]},{id:uid(),name:'Almuerzo',items:[]},{id:uid(),name:'Cena',items:[]}]};return S.plans[pid]}
VIEWS.plan=()=>{
  const p=P();if(!p)return `<h2 class="pt">Plan alimentario</h2>`+needP();
  const pl=planOf(p.id),t=pl.target;
  return `<h2 class="pt">Plan alimentario — ${esc(p.name)}</h2>
  ${p.allergies?msg(`Alergias/intolerancias registradas: ${esc(p.allergies)}`,'warn'):''}
  <div class="card"><h3>Objetivo</h3><div class="grid"><div><label>kcal</label><input id="tk" type="number" value="${t.k}" oninput="setT()"></div><div><label>CHO g</label><input id="tc" type="number" value="${t.c}" oninput="setT()"></div><div><label>Proteína g</label><input id="tp" type="number" value="${t.p}" oninput="setT()"></div><div><label>Grasa g</label><input id="tf" type="number" value="${t.f}" oninput="setT()"></div></div></div>
  <div class="card"><h3>Análisis del plan</h3><div class="scroll"><table><thead><tr><th>Nutriente</th><th>Objetivo</th><th>Plan</th><th>Diferencia</th><th>% cumplimiento</th><th>Estado</th></tr></thead><tbody id="cmp"></tbody></table></div><div id="cmpNote"></div></div>
  <div class="card"><h3>Agregar a una comida</h3><div class="grid"><div><label>Comida</label><select id="im">${pl.meals.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div><div><label>Tipo</label><select id="it" onchange="itemForm()"><option value="food">Alimento</option><option value="ex">Intercambio</option><option value="rec">Receta</option></select></div></div><div class="grid" id="itf" style="margin-top:10px"></div>
  <div class="row"><button class="btn" onclick="addItem()">Agregar</button><button class="btn sec" onclick="addMeal()">Nueva comida…</button></div><div id="oI"></div></div>
  <div id="meals"></div>`;
};
AFTER.plan=()=>{if(P()){itemForm();renderPlan()}};
function setT(){const t=planOf(S.cur).target;t.k=V('tk');t.c=V('tc');t.p=V('tp');t.f=V('tf');save();renderPlan()}
function itemForm(){
  const t=V('it');let h='';
  if(t==='food')h=`<div><label>Alimento</label><select id="if" onchange="unitOpts()">${foodOpts()}</select></div><div><label>Cantidad</label><input id="iq" type="number" step="0.1"></div><div><label>Unidad</label><select id="iu"></select></div>`;
  if(t==='ex')h=`<div><label>Grupo</label><select id="ig">${S.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div><label>Intercambios</label><select id="in"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option><option value="c">Otra…</option></select></div><div><label>Personalizado</label><input id="inc" type="number" step="0.1"></div>`;
  if(t==='rec')h=`<div><label>Receta</label><select id="ir">${S.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div><label>Porciones</label><input id="ip" type="number" step="0.5" value="1"></div>`;
  $('itf').innerHTML=h;if(t==='food')unitOpts();
}
function unitOpts(){const f=S.foods.find(x=>x.id==V('if'));$('iu').innerHTML='<option value="g">g / ml</option>'+(f?(f.measures||[]).map(m=>`<option>${esc(m.label)}</option>`).join(''):'')}
function addItem(){
  const pl=planOf(S.cur),m=pl.meals.find(x=>x.id==V('im')),t=V('it');let it=null;
  if(t==='food'){const fid=Number(V('if')),q=N('iq');if(!fid)return $('oI').innerHTML=msg('Agrega alimentos primero.','err');if(!q||isNaN(q)||q<=0)return $('oI').innerHTML=msg('Cantidad inválida.','err');it={type:'food',fid,qty:q,m:V('iu')}}
  if(t==='ex'){const gid=Number(V('ig'));let n=V('in')==='c'?N('inc'):Number(V('in'));if(!gid)return $('oI').innerHTML=msg('Crea un grupo de intercambio primero.','err');if(!n||isNaN(n)||n<=0)return $('oI').innerHTML=msg('Cantidad de intercambios inválida.','err');it={type:'ex',gid,n}}
  if(t==='rec'){const rid=Number(V('ir')),q=N('ip');if(!rid)return $('oI').innerHTML=msg('Crea una receta primero.','err');if(!q||isNaN(q)||q<=0)return $('oI').innerHTML=msg('Porciones inválidas.','err');it={type:'rec',rid,por:q}}
  m.items.push(it);save();$('oI').innerHTML='';renderPlan();
}
function addMeal(){const n=prompt('Nombre de la comida:');if(n&&n.trim()){planOf(S.cur).meals.push({id:uid(),name:n.trim(),items:[]});save();render()}}
function delItem(mid,ix){planOf(S.cur).meals.find(m=>m.id===mid).items.splice(ix,1);save();renderPlan()}
function delMeal(mid){if(confirm('¿Eliminar esta comida con sus alimentos?')){const pl=planOf(S.cur);pl.meals=pl.meals.filter(m=>m.id!==mid);save();render()}}
function cmpRows(pl,all){
  const t=pl.target,rows=[['Energía (kcal)',t.k,all.k],['Carbohidratos (g)',t.c,all.c],['Proteínas (g)',t.p,all.p],['Grasas (g)',t.f,all.f]];
  return rows.map(([n,o,v])=>{const ov=o===''?null:Number(o);
    if(ov===null||isNaN(ov)||ov<=0)return `<tr><td>${n}</td><td>sin objetivo</td><td>${f1(v,0)}</td><td>—</td><td>—</td><td>—</td></tr>`;
    const pct=v/ov*100,d=v-ov,st=pct<90?'<span class="pill lo">Por debajo</span>':pct>110?'<span class="pill hi">Por encima</span>':'<span class="pill ok">En rango (±10%)</span>';
    return `<tr><td>${n}</td><td>${f1(ov,0)}</td><td>${f1(v,0)}</td><td>${d>=0?'+':''}${f1(d,0)}</td><td>${f1(pct,0)}%</td><td>${st}</td></tr>`}).join('')+`<tr><td>Fibra (g)</td><td>—</td><td>${f1(all.fb,0)}${all.fbMiss?' <small>(parcial)</small>':''}</td><td>—</td><td>—</td><td>—</td></tr>`;
}
function renderPlan(){
  const pl=planOf(S.cur),all=sumItems(pl.meals.flatMap(m=>m.items));
  $('cmp').innerHTML=cmpRows(pl,all);
  $('cmpNote').innerHTML=microHtml(pl.meals.flatMap(m=>m.items))+(all.exMiss?msg('Hay grupos de intercambio sin valores de referencia: no suman nutrientes. Complétalos en Intercambios.','warn'):'')+(all.fbMiss?msg('La fibra es parcial: algunos ítems no tienen dato de fibra.','info'):'');
  $('meals').innerHTML=pl.meals.map(m=>{const T=sumItems(m.items);return `<div class="card"><h3 style="display:flex;justify-content:space-between">${esc(m.name)} <button class="x" onclick="delMeal(${m.id})">&times;</button></h3><div class="scroll"><table><thead><tr><th>Ítem</th><th>kcal</th><th>CHO</th><th>P</th><th>G</th><th></th></tr></thead><tbody>${m.items.map((i,ix)=>{const n=itemNut(i);return `<tr><td>${itemLabel(i)}</td><td>${f1(n.k,0)}</td><td>${f1(n.c)}</td><td>${f1(n.p)}</td><td>${f1(n.f)}</td><td><button class="x" onclick="delItem(${m.id},${ix})">&times;</button></td></tr>`}).join('')}<tr><th>Total</th><th>${f1(T.k,0)}</th><th>${f1(T.c)}</th><th>${f1(T.p)}</th><th>${f1(T.f)}</th><th></th></tr></tbody></table></div></div>`}).join('');
}

/* ========== Recetas ========== */
VIEWS.recipes=()=>{
  const r=S.recipes.find(x=>x.id===S.recSel);
  let det='';
  if(r){const t=recipeNut(r),q=1/r.portions;
    det=`<div class="card"><h3>${esc(r.name)} <span class="tag">${r.portions} porciones</span></h3>${r.yield?`<p class="hint">Rendimiento: ${r.yield} g</p>`:''}
    <div class="row" style="margin:0 0 8px"><div><label>Ingrediente</label><select id="ri">${foodOpts()}</select></div><div><label>Gramos</label><input id="rg" type="number" step="0.1" style="width:110px"></div><button class="btn sm" onclick="addIng()">Agregar</button></div>

    <tr><th>Total receta</th><th></th><th>${f1(t.k,0)}</th><th>${f1(t.c)}</th><th>${f1(t.p)}</th><th>${f1(t.f)}</th><th></th></tr><tr><th>Por porción</th><th></th><th>${f1(t.k*q,0)}</th><th>${f1(t.c*q)}</th><th>${f1(t.p*q)}</th><th>${f1(t.f*q)}</th><th></th></tr></tbody></table></div>

AFTER.track=()=>{
  const p=P();if(!p)return;const rs=recsOf(p.id);
  chart('ch_w',rs.filter(r=>r.w).map(r=>[r.date,r.w]));
  chart('ch_imc',rs.filter(r=>r.w&&r.h).map(r=>[r.date,r.w/((r.h/100)**2)]));
  chart('ch_wa',rs.filter(r=>r.wa).map(r=>[r.date,r.wa]));
};
function chart(id,pts){
  const cv=$(id),ctx=cv.getContext('2d');ctx.font='13px system-ui';ctx.fillStyle='#62767a';
  if(pts.length<2){ctx.fillText('Se necesitan al menos 2 mediciones con este dato.',16,36);return}
  const L=48,W=cv.width-L-16,H=cv.height-50;let mn=Math.min(...pts.map(x=>x[1])),mx=Math.max(...pts.map(x=>x[1]));if(mn===mx){mn-=1;mx+=1}const pad=(mx-mn)*.1;mn-=pad;mx+=pad;
  ctx.strokeStyle='#dde7e6';for(let i=0;i<=4;i++){const y=14+H*i/4;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(L+W,y);ctx.stroke();ctx.fillText(f1(mx-(mx-mn)*i/4),2,y+4)}
  const X=i=>L+W*i/(pts.length-1),Y=v=>14+H*(1-(v-mn)/(mx-mn));
  ctx.strokeStyle='#14937a';ctx.lineWidth=2.5;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(X(i),Y(p[1])):ctx.moveTo(X(i),Y(p[1])));ctx.stroke();
  pts.forEach((p,i)=>{ctx.fillStyle='#14937a';ctx.beginPath();ctx.arc(X(i),Y(p[1]),4,0,7);ctx.fill();ctx.fillStyle='#62767a';if(pts.length<=8||i%Math.ceil(pts.length/8)===0)ctx.fillText(p[0].slice(2),X(i)-24,cv.height-8)});
}

function exportBackup(){
  const b=new Blob([JSON.stringify({app:'nutripro',version:6,fecha:new Date().toISOString(),datos:S})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nutripro-respaldo-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();S.lastBackup=Date.now();save();
}
function importBackup(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{
    const j=JSON.parse(rd.result),d=j&&j.app==='nutripro'?j.datos:null;
    if(!d||!Array.isArray(d.patients))throw new Error('formato');
    if(!confirm('Esto reemplaza los datos actuales por los del respaldo. ¿Continuar?'))return;
    try{LS.setItem(KEY+'_antes_de_restaurar',LS.getItem(KEY)||'')}catch(_){}
    LS.setItem(KEY,JSON.stringify(d));location.reload();
  }catch(e){alert('El archivo no es un respaldo válido de NutriPro.')}};
  rd.readAsText(f);
}

 <div class="card"><h3>Copia de seguridad</h3><p class="hint">Tus datos se guardan solo en este navegador: si borras el historial o cambias de equipo, se pierden. Descarga un respaldo con frecuencia.</p>

VIEWS.smart=()=>{
  const T='Asistente inteligente',p=P();if(!p)return `<h2 class="pt">${T}</h2>`+needP();
  const r=lastRec(p.id);
  if(!r||!r.h)return `<h2 class="pt">${T} — ${esc(p.name)}</h2><div class="card">${msg('Registra una medición con peso y talla en Antropometría para activar el análisis.','info')}<div class="row"><button class="btn" onclick="go('antro')">Ir a Antropometría</button></div></div>`;
  const age=p.birth?ageOf(p.birth):null,sex=p.sex,m=r.h/100,imc=r.w/(m*m),goal=p.smartGoal||'maintain',af=Number(p.smartAF)||1.55;
  const cat=imc<18.5?'Bajo peso':imc<25?'Normopeso':imc<30?'Sobrepeso':'Obesidad',lo=18.5*m*m,hi=24.9*m*m,h=[],al=[];
  h.push(`IMC <b>${f1(imc)}</b> (${cat}). Peso con IMC 18,5–24,9 para su talla: <b>${f1(lo)}–${f1(hi)} kg</b>${r.w>hi?` (${f1(r.w-hi)} kg sobre el límite superior)`:r.w<lo?` (${f1(lo-r.w)} kg bajo el límite inferior)`:' — dentro del rango'}.`);
  if(r.wa&&sex){const[a,b]=sex==='M'?[94,102]:[80,88];h.push(`Cintura ${f1(r.wa)} cm: riesgo cardiometabólico ${r.wa>=b?'<b>muy aumentado</b>':r.wa>=a?'<b>aumentado</b>':'bajo'} (OMS: ${a}/${b} cm).`)}
  if(r.wa&&r.hi&&sex){const l=sex==='M'?.9:.85,v=r.wa/r.hi;h.push(`ICC ${f1(v,2)}: ${v>=l?'<b>por encima</b>':'por debajo'} del límite OMS (${String(l).replace('.',',')}).`)}
  const rs=recsOf(p.id).filter(x=>x.w);
  if(rs.length>=2){const t0=new Date(rs[0].date),X=rs.map(x=>(new Date(x.date)-t0)/6048e5),Y=rs.map(x=>x.w),n=X.length,mx=X.reduce((a,b)=>a+b)/n,my=Y.reduce((a,b)=>a+b)/n,den=X.reduce((a,x)=>a+(x-mx)**2,0);
    if(den>0){const s=X.reduce((a,x,i)=>a+(x-mx)*(Y[i]-my),0)/den;h.push(`Tendencia de peso: <b>${s>=0?'+':''}${f1(s,2)} kg/semana</b> (${n} mediciones). A este ritmo, en 4 semanas: ~${f1(r.w+s*4)} kg.`);if(Math.abs(s)>1)al.push(['warn','El peso cambia más de 1 kg/semana: verifica las mediciones o el ritmo.'])}}
  if((Date.now()-new Date(r.date))/864e5>30)al.push(['info','La última medición tiene más de 30 días: conviene actualizarla.']);
  let en='',tg=null;
  if(age===null||!sex)en=msg('Completa sexo y fecha de nacimiento en la ficha del paciente para estimar energía.','info');
  else if(age<18)en=msg('Paciente menor de 18 años: las ecuaciones y metas de esta sección son para adultos y no se aplican.','warn');
  else{
    const tmb=10*r.w+6.25*r.h-5*age+(sex==='M'?5:-161),get=tmb*af,k=Math.round(Math.max(goal==='lose'?get*.85:goal==='gain'?get*1.1:get,tmb)),bw=imc>=30?25*m*m:r.w,pg=Math.round(bw*({lose:1.2,maintain:1,gain:1.4}[goal])),fg=Math.round(k*.27/9),cg=Math.max(0,Math.round((k-pg*4-fg*9)/4)),rate=(get-k)*7/7700;
    tg={k,c:cg,p:pg,f:fg};LAST.smart=tg;
    if(goal==='lose'&&imc<18.5)al.push(['err','Meta de pérdida de peso con IMC bajo: no es apropiada. Revisa el objetivo.']);
    if(goal==='gain'&&imc>=30)al.push(['warn','Meta de aumento de peso con obesidad: confirma que es lo indicado.']);
    en=`<div class="steps"><div><b>TMB (Mifflin-St Jeor):</b> ${f1(tmb,0)} kcal · <b>GET</b> (×${af}): ${f1(get,0)} kcal</div>
    <div><b>Meta sugerida:</b> <span class="res">${k} kcal/día</span> (${goal==='lose'?'−15% del GET, sin bajar de la TMB':goal==='gain'?'+10% del GET':'= GET'}) · ritmo esperado ≈ ${f1(Math.abs(rate),2)} kg/semana</div>
    <div><b>Macros:</b> proteína ${pg} g (${f1(pg/bw,1)} g/kg${imc>=30?' de peso ajustado':''}) · grasa ${fg} g (27%) · CHO ${cg} g</div>
    <div><b>Referencias:</b> fibra ≈ ${Math.round(k/1000*14)} g · agua ≈ ${f1(r.w*35/1000,1)} L · sodio &lt; 2000 mg</div></div>
    <div class="row"><button class="btn" onclick="useSmart()">Usar como objetivo del plan</button></div>`;
  }
  const pl=planOf(p.id),all=sumItems(pl.meals.flatMap(x=>x.items));let pc;
  if(all.k>0){const L=[];
    if(tg)L.push(`Energía del plan: ${f1(all.k,0)} kcal (${f1(all.k/tg.k*100,0)}% de la meta sugerida).`);
    L.push(`Proteína del plan: ${f1(all.p,0)} g (${f1(all.p/r.w,2)} g/kg).`);
    if(tg&&!all.fbMiss)L.push(`Fibra: ${f1(all.fb,0)} g (referencia ≈ ${Math.round(tg.k/1000*14)} g).`);
    L.push('Distribución de la energía: '+pl.meals.map(x=>`${esc(x.name)} ${f1(sumItems(x.items).k/all.k*100,0)}%`).join(' · '));

  else pc=msg('El plan aún no tiene alimentos.','info');
  const terms=norm(p.allergies).split(/[,;\n]+|\sy\s/).map(s=>s.trim()).filter(s=>s.length>=3);
  if(terms.length){const hits=new Set();pl.meals.forEach(x=>x.items.forEach(i=>{const t=norm(itemText(i));terms.forEach(a=>{if(t.includes(a))hits.add(a)})}));
    al.push(hits.size?['err',`Posible coincidencia con alergias/intolerancias en el plan: <b>${[...hits].map(esc).join(', ')}</b>. Revisa los alimentos.`]:['ok','Sin coincidencias de nombre con las alergias registradas (revisa igualmente ingredientes y etiquetas).'])}
  return `<h2 class="pt">${T} — ${esc(p.name)}</h2>
  ${al.map(x=>msg(x[1],x[0])).join('')}
  <div class="card"><h3>Lectura de la última medición (${r.date})</h3>${h.map(x=>`<div style="margin:6px 0">• ${x}</div>`).join('')}</div>
  <div class="card"><h3>Meta energética y de macronutrientes</h3><div class="grid"><div><label>Objetivo</label><select onchange="setSmart('smartGoal',this.value)"><option value="lose" ${goal==='lose'?'selected':''}>Perder peso</option><option value="maintain" ${goal==='maintain'?'selected':''}>Mantener</option><option value="gain" ${goal==='gain'?'selected':''}>Aumentar peso</option></select></div><div><label>Actividad</label><select onchange="setSmart('smartAF',this.value)">${[['1.2','Sedentario'],['1.375','Ligera'],['1.55','Moderada'],['1.725','Alta'],['1.9','Muy alta']].map(([v,t])=>`<option value="${v}" ${af==v?'selected':''}>${t} (${v})</option>`).join('')}</select></div></div>${en}</div>
  <div class="card"><h3>Revisión del plan actual</h3>${pc}</div>
  ${msg('Valores de referencia generales (Mifflin-St Jeor, OMS). Son estimaciones de apoyo: un profesional debe revisarlas y ajustarlas a cada persona.','warn')}`;
};

/* ========== Dieta semanal y lista de compras ========== */
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];let WD=0;
function wk(pid){if(!Array.isArray(S.week[pid])||S.week[pid].length!==7)S.week[pid]=DAYS.map(()=>[]);return S.week[pid]}
function shopList(pid){
  const m={},ex={};
  wk(pid).forEach(d=>d.forEach(x=>{const i=x.it;
    if(i.type==='food'){const f=S.foods.find(a=>a.id===i.fid);if(f)m[f.id]=(m[f.id]||0)+gramsOf(f,i.qty,i.m)}
    else if(i.type==='rec'){const r=S.recipes.find(a=>a.id===i.rid);if(r)r.ings.forEach(g=>{m[g.fid]=(m[g.fid]||0)+g.g*i.por/r.portions})}
    else if(i.type==='ex'){const g=S.groups.find(a=>a.id===i.gid);if(g)ex[g.name]=(ex[g.name]||0)+i.n}}));
  return {m,ex};
}

  return `<h2 class="pt">Dieta semanal — ${esc(p.name)}</h2>
  <div class="card noprint"><div class="row" style="margin:0">${DAYS.map((d,i)=>`<button class="btn sm ${i===WD?'':'sec'}" onclick="WD=${i};render()">${d.slice(0,3)}</button>`).join('')}</div>
  <div class="row"><button class="btn sec sm" onclick="copyBase()">Copiar el plan base a toda la semana</button><button class="btn sec sm" onclick="copyDay()">Copiar este día a todos</button><button class="btn sm" onclick="window.print()">Imprimir semana</button></div></div>

  <div class="grid"><div><label>Comida</label><select id="wm">${pl.meals.map(m=>`<option>${esc(m.name)}</option>`).join('')}</select></div><div><label>Alimento / receta</label><select id="wf"><optgroup label="Alimentos">${S.foods.map(x=>`<option value="f${x.id}">${esc(x.n)}</option>`).join('')}</optgroup><optgroup label="Recetas">${S.recipes.map(x=>`<option value="r${x.id}">${esc(x.name)}</option>`).join('')}</optgroup></select></div><div><label>Gramos / porciones</label><input id="wq" type="number" step="0.1"></div></div>
  <div class="row"><button class="btn" onclick="addWk()">Agregar al día</button></div><div id="oW"></div>
  ${pl.meals.map(m=>`<h4 style="margin:12px 0 4px">${esc(m.name)}</h4><ul style="margin:0">${day.map((x,ix)=>x.meal===m.name?`<li>${itemLabel(x.it)} <button class="x" onclick="wk(${p.id})[WD].splice(${ix},1);save();render()">&times;</button></li>`:'').join('')||'<li class="mut">—</li>'}</ul>`).join('')}</div>
  <div class="card"><h3>Resumen de la semana</h3><table><tbody>${DAYS.map((d,i)=>`<tr><td>${d}</td><td>${f1(tot[i],0)} kcal</td></tr>`).join('')}<tr><th>Promedio (días con alimentos)</th><th>${used.length?f1(used.reduce((a,b)=>a+b)/used.length,0):'—'} kcal</th></tr></tbody></table></div>

function addWk(){

function copyBase(){

function homeCalc(){
  const s=V('hs'),a=N('ha'),w=N('hw'),h=N('hh'),af=Number(V('hf')),g=V('hg'),o=$('hout');if(!o)return;
  if(!(a>0&&w>0&&h>0)||a>120||w>500||h>260){o.innerHTML='<p class="mut">Completa edad, peso y talla con valores válidos.</p>';return}
  if(a<18){o.innerHTML=msg('Las ecuaciones incluidas son para adultos (18 años o más).','warn');return}
  const tmb=10*w+6.25*h-5*a+(s==='M'?5:-161),get=tmb*af,k=Math.round(Math.max(g==='lose'?get*.85:g==='gain'?get*1.1:get,tmb)),pg=w*({lose:1.2,maintain:1,gain:1.4}[g]),fg=k*.27/9,cg=Math.max(0,(k-pg*4-fg*9)/4),C=339.29;
  const parts=[[cg*4,'#0f8b72','Carbohidratos',cg],[pg*4,'#e8a33d','Proteína',pg],[fg*9,'#4a8bc4','Grasa',fg]],tot=parts.reduce((x,y)=>x+y[0],0);let cum=0;
  const arcs=parts.map(x=>{const l=x[0]/tot*C,r=`<circle cx="70" cy="70" r="54" fill="none" stroke="${x[1]}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-cum}"/>`;cum+=l;return r}).join('');
  o.innerHTML=`<svg viewBox="0 0 140 140" class="donut"><g transform="rotate(-90 70 70)">${arcs}</g><text x="70" y="68" text-anchor="middle" class="dk">${k}</text><text x="70" y="86" text-anchor="middle" class="dl">kcal/día</text></svg><div class="leg">${parts.map(x=>`<div><i style="background:${x[1]}"></i>${x[2]} <b>${f1(x[3],0)} g</b></div>`).join('')}<small>TMB ${f1(tmb,0)} · GET ${f1(get,0)} kcal. Estimación (Mifflin-St Jeor); no sustituye al profesional.</small></div>`;
}

const FBV='10.14.1',CFGK='nutripro_fbcfg',RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    match /users/{uid} {\n      allow read, write: if request.auth != null && request.auth.uid == uid;\n    }\n  }\n}";
var FB=null,FBU=null,FBMSG='',syncT=null;
const fbCfg=()=>{try{return JSON.parse(LS.getItem(CFGK)||'null')}catch(e){return null}};
async function fbInit(){
  if(FB)return FB;const c=fbCfg();if(!c)return null;const B='https://www.gstatic.com/firebasejs/'+FBV+'/';
  const [a,au,fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app=a.initializeApp(c);FB={au,fs,auth:au.getAuth(app),db:fs.getFirestore(app)};
  au.onAuthStateChanged(FB.auth,u=>{FBU=u;if(u)cloudLogin();else if(S.view==='cloud')render()});
  return FB;
}
function schedPush(){clearTimeout(syncT);syncT=setTimeout(()=>cloudPush().catch(e=>{FBMSG='No se pudo sincronizar: '+e.message}),2500)}
async function cloudPush(){
  if(!FBU||!FB)return;const data=JSON.stringify(S);
  if(data.length>900000){FBMSG='Tus datos superan el límite de ~1 MB de la nube. Quita el logo o archiva datos.';return}
  const ref=FB.fs.doc(FB.db,'users',FBU.uid),sn=await FB.fs.getDoc(ref);
  if(sn.exists()&&(sn.data().updated||0)>(S.cloudAt||0)){FBMSG='Otro equipo guardó cambios más nuevos. Recarga la página para elegir cuáles conservar.';return}
  const t=Date.now();await FB.fs.setDoc(ref,{data,updated:t});
  S.cloudAt=t;try{LS.setItem(KEY,JSON.stringify(S))}catch(_){}FBMSG='';
}
function cloudApply(d){
  try{LS.setItem(KEY+'_antes_de_nube',LS.getItem(KEY)||'')}catch(_){}
  const o=JSON.parse(d.data);o.cloudAt=d.updated;LS.setItem(KEY,JSON.stringify(o));location.reload();
}
async function cloudLogin(){
  try{
    const snap=await FB.fs.getDoc(FB.fs.doc(FB.db,'users',FBU.uid));
    if(!snap.exists()){await cloudPush()}
    else{const d=snap.data();
      if((d.updated||0)>(S.cloudAt||0)){
        if(!(S.patients.length||S.foods.length)||confirm('Hay datos más recientes en tu nube. ¿Cargarlos? Reemplazan los de este equipo (antes se guarda una copia local).'))return cloudApply(d);
      }
      await cloudPush();
    }
  }catch(e){FBMSG='No se pudo sincronizar: '+e.message}
  if(S.view==='cloud')render();
}

function csvLine(l,d){const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===d&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())}

function importFoods(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>importFoodsText(String(rd.result));rd.readAsText(f);inp.value=''}
function importFoodsText(txt){
  {
    const lines=String(txt).replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim()),o=$('oImp');
    if(lines.length<2)return o.innerHTML=msg('El archivo no tiene filas de datos.','err');
    const d=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':',',H=csvLine(lines[0],d).map(norm),col=(...a)=>H.findIndex(h=>a.some(x=>h.startsWith(x)));
    const ix={n:col('nombre','alimento'),g:col('categ'),k:col('kcal','energ'),p:col('prote'),c:col('cho','carbo'),f:col('grasa','lipid'),fb:col('fibra'),na:col('sodio'),ca:col('calcio'),fe:col('hierro'),po:col('potasio'),vc:col('vitamina c','vit'),src:col('fuente')};
    const need=['n','k','p','c','f','src'].filter(k=>ix[k]<0);
    if(need.length)return o.innerHTML=msg('Faltan columnas en el encabezado: '+need.join(', ')+'. Descarga la plantilla.','err');
    let ok=0;const errs=[],num=s=>{s=(s||'').trim();return s===''?null:Number(s.replace(',','.'))};
    lines.slice(1).forEach((l,i)=>{
      const r=csvLine(l,d),n=r[ix.n],src=r[ix.src],k=num(r[ix.k]),p=num(r[ix.p]),c=num(r[ix.c]),g=num(r[ix.f]),fb=ix.fb>=0?num(r[ix.fb]):null,na=ix.na>=0?num(r[ix.na]):null,mi=['ca','fe','po','vc'].map(k=>ix[k]>=0?num(r[ix[k]]):null),ln=i+2;
      if(!n)return errs.push(`Línea ${ln}: falta el nombre.`);
      if(!src)return errs.push(`Línea ${ln} (${n}): falta la fuente.`);
      if([k,p,c,g].some(v=>v===null||isNaN(v)||v<0))return errs.push(`Línea ${ln} (${n}): energía o macronutrientes inválidos.`);
      if([fb,na,...mi].some(v=>v!==null&&(isNaN(v)||v<0)))return errs.push(`Línea ${ln} (${n}): fibra o sodio inválidos.`);
      if(p*4+c*4+g*9>k*1.5+20)return errs.push(`Línea ${ln} (${n}): la energía no concuerda con los macronutrientes.`);
      if(S.foods.some(x=>norm(x.n)===norm(n)))return errs.push(`Línea ${ln} (${n}): ya existe, se omitió.`);
      S.foods.push({id:uid(),n,g:ix.g>=0?r[ix.g]:'',k,p,c,f:g,fb,na,ca:mi[0],fe:mi[1],po:mi[2],vc:mi[3],src,sv:'',measures:[]});ok++;
    });
    save();
    o.innerHTML=msg(`Se importaron ${ok} alimento(s).`,ok?'ok':'warn')+(errs.length?msg(`${errs.length} fila(s) omitidas:<br>${errs.slice(0,10).map(esc).join('<br>')}${errs.length>10?'<br>…':''}`,'warn'):'');
    renderFoodRows();
  }
}
